<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — YasirLab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B3D91">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/assets/favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0B3D91;--text:#0F172A;--muted:#475569;--border:#E5EAF6;--light:#F6F8FF}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;color:var(--text);background:#fff;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
header{border-bottom:1px solid var(--border);padding:12px 0}
.header-inner{max-width:900px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
.logo{background:var(--blue);color:#fff;font-weight:800;font-size:13px;padding:6px 8px;border-radius:4px;text-decoration:none}
main{flex:1;display:grid;place-items:center;padding:48px 24px;text-align:center}
.card{max-width:520px;border:1px solid var(--border);border-radius:10px;padding:32px;background:#fff;box-shadow:0 8px 24px rgba(15,23,42,.06)}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:32px;line-height:1.1;margin:0}
p{color:var(--muted);margin-top:10px}
.actions{margin-top:20px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:10px 16px;border-radius:6px;font-weight:600;font-size:14px;border:1px solid var(--blue);display:inline-flex;gap:6px;align-items:center}
.btn-primary{background:var(--blue);color:#fff}
.btn-outline{color:var(--blue);background:#fff}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="/" class="logo">YJ</a>
    <a href="/" style="font-weight:600;font-size:13px;color:var(--blue)">← Back to YasirLab</a>
  </div>
</header>
<main>
  <div class="card">
    <h1>404 — Page not found</h1>
    <p>The page you’re looking for doesn’t exist or was moved. Check the URL or return to the portfolio.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Go to homepage</a>
      <a href="/pages/all-projects.html" class="btn btn-outline">View all projects</a>
    </div>
    <p style="margin-top:16px;font-size:12px;color:var(--muted)">yasirlab.in · Build → Experiment → Evaluate → Deploy</p>
  </div>
</main>
</body>
</html>
